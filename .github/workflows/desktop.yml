name: Desktop application
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  install:
    name: Install and cache dependencies
    runs-on: ubuntu-24.04-arm
    outputs:
      cache-key: ${{ steps.key.outputs.value }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: key
        run: echo "value=workspace-v1-${{ runner.os }}-${{ runner.arch }}-node24-pnpm12.9.1-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml', 'package.json', 'packages/*/package.json') }}" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: cache
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ steps.key.outputs.value }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
  checks:
    name: Format, lint and type checks
    needs: install
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true
      - run: pnpm fmt:check
      - run: pnpm lint
      - run: pnpm typecheck
  unit-tests:
    name: Unit tests
    needs: install
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true
      - run: pnpm test
  build:
    name: Build application
    needs: install
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true
      - run: |
          pnpm build
          git rev-parse HEAD > "$RUNNER_TEMP/build.commit"
          tar -cf "$RUNNER_TEMP/build.tar" packages/contract/dist packages/db/dist packages/electron/dist
      - uses: actions/upload-artifact@v4
        with:
          name: application-build-${{ github.sha }}
          path: |
            ${{ runner.temp }}/build.tar
            ${{ runner.temp }}/build.commit
          overwrite: true
          if-no-files-found: error
          compression-level: 0
  desktop:
    name: Desktop smoke
    needs: [install, build]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: application-build-${{ github.sha }}
          path: ${{ runner.temp }}/build
      - name: Restore the same-commit application
        run: |
          test "$(cat "$RUNNER_TEMP/build/build.commit")" = "$(git rev-parse HEAD)"
          tar -xpf "$RUNNER_TEMP/build/build.tar"
      - name: Install desktop runtime dependencies
        run: |
          pnpm exec playwright install-deps chromium
          sudo apt-get install -y libgtk-3-0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user true
      - run: xvfb-run -a pnpm test:desktop
  package-proof:
    name: Linux arm64 package proof
    needs: [install, build]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: application-build-${{ github.sha }}
          path: ${{ runner.temp }}/build
      - name: Restore the same-commit application
        run: |
          test "$(cat "$RUNNER_TEMP/build/build.commit")" = "$(git rev-parse HEAD)"
          tar -xpf "$RUNNER_TEMP/build/build.tar"
      - name: Install desktop runtime dependencies
        run: |
          pnpm exec playwright install-deps chromium
          sudo apt-get install -y libgtk-3-0
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --user --map-root-user true
      - run: pnpm package:linux
      - run: xvfb-run -a pnpm test:package
        env:
          BUILD_COMMIT_FILE: ${{ runner.temp }}/build/build.commit
      - uses: actions/upload-artifact@v4
        with:
          name: tested-installer-${{ github.sha }}
          path: |
            release/*.deb
            release/package-proof.json
          overwrite: true
          if-no-files-found: error
          compression-level: 0
  linux-arm64:
    name: Linux arm64 build and acceptance
    needs: [install, checks, unit-tests, build, desktop, package-proof]
    if: always()
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Require every check
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: echo "$RESULTS" | jq -e 'all(.[]; .result == "success")'
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: ${{ needs.install.outputs.cache-key }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          name: tested-installer-${{ github.sha }}
          path: release
      - name: Validate and stage the tested installer
        run: pnpm release:stage
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: ${{ github.sha }}
          path: release/assets/*
          overwrite: true
          if-no-files-found: error
