name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - parallel:
          - name: Typecheck
            run: bun run typecheck
          - name: Lint
            run: bun run lint
          - name: Check formatting
            run: bun run fmt:check
      - name: Restore acceptance timings
        uses: actions/cache/restore@v5
        continue-on-error: true
        with:
          path: ${{ runner.temp }}/acceptance-timings/baseline.json
          key: acceptance-timings-v1-bun-1.4.2-${{ runner.os }}-main-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: acceptance-timings-v1-bun-1.4.2-${{ runner.os }}-main-
      - name: Validate acceptance timing baseline
        run: |
          mkdir -p "$RUNNER_TEMP/acceptance-timings"
          if [ ! -f "$RUNNER_TEMP/acceptance-timings/baseline.json" ]; then
            printf '%s\n' '{"version":1,"files":{}}' > "$RUNNER_TEMP/acceptance-timings/baseline.json"
          fi
          jq --exit-status '
            type == "object" and .version == 1 and (.files | type == "object")
            and all(.files[]; type == "number" and isfinite and . >= 0)
          ' "$RUNNER_TEMP/acceptance-timings/baseline.json" > /dev/null
      # Freeze one baseline so cache updates cannot change assignments between shards.
      - uses: actions/upload-artifact@v7
        with:
          name: acceptance-timing-baseline
          path: ${{ runner.temp }}/acceptance-timings/baseline.json
          retention-days: 1
          if-no-files-found: error
      - run: tar -cf "${{ runner.temp }}/node_modules.tar" node_modules
      - uses: actions/upload-artifact@v7
        with:
          name: node-modules
          path: ${{ runner.temp }}/node_modules.tar
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  test-source:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v8
        with:
          name: node-modules
          path: ${{ runner.temp }}
      - run: tar -xf "${{ runner.temp }}/node_modules.tar"
      - run: bun run test:source

  test-acceptance:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v8
        with:
          name: node-modules
          path: ${{ runner.temp }}
      - run: tar -xf "${{ runner.temp }}/node_modules.tar"
      - uses: actions/download-artifact@v8
        with:
          name: acceptance-timing-baseline
          path: ${{ runner.temp }}/acceptance-timings
      - name: Run acceptance shard
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          bun test --cwd acceptance --shard="$SHARD/4" \
            --timings="$RUNNER_TEMP/acceptance-timings/shard-$SHARD.json" \
            --timings="$RUNNER_TEMP/acceptance-timings/baseline.json" \
            --update-timings
      - uses: actions/upload-artifact@v7
        if: ${{ success() && github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        with:
          name: acceptance-timings-v1-bun-1.4.2-${{ matrix.shard }}
          path: ${{ runner.temp }}/acceptance-timings/shard-${{ matrix.shard }}.json
          retention-days: 8
          if-no-files-found: error

  test:
    needs: [test-source, test-acceptance]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require both test suites to pass
        env:
          SOURCE_RESULT: ${{ needs.test-source.result }}
          ACCEPTANCE_RESULT: ${{ needs.test-acceptance.result }}
        run: |
          test "$SOURCE_RESULT" = success
          test "$ACCEPTANCE_RESULT" = success
