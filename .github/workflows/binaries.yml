name: Binaries

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      targets: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - id: targets
        run: echo "matrix=$(bun scripts/release.ts matrix)" >> "$GITHUB_OUTPUT"

  binary:
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}
    name: Binary ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: Build and run the native executable
        env:
          TARGET: ${{ matrix.id }}
        run: |
          set -euo pipefail
          bun run build "$TARGET"
          bun run verify:binary dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.id }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  assets:
    needs: binary
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - run: bun run stage:release dist
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
