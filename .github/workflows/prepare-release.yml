name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: auto, major, minor, patch, or a stable version without v
        required: true
        default: auto
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: craft-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Validate request and pending releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^(auto|major|minor|patch)$ || "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          if [[ ! "$VERSION" =~ ^(auto|major|minor|patch)$ ]] && git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists. Choose an unreleased version."
            exit 1
          fi
          gh pr list --base main --state open --limit 1000 --json headRefName |
            jq -e 'all(.[]; (.headRefName | startswith("release/")) | not)'
          if git ls-remote --exit-code --heads origin "release/$VERSION"; then
            echo "Release branch already exists. Inspect it and open its PR or remove it before preparing again."
            exit 1
          fi
      - name: Install Craft
        run: |
          curl -fsSL --retry 3 https://github.com/getsentry/craft/releases/download/2.33.1/craft -o "$RUNNER_TEMP/craft.cjs"
          node "$RUNNER_TEMP/craft.cjs" --version
      - name: Prepare version and changelog
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_COMMITTER_NAME: ${{ github.actor }}
          EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
        run: |
          git remote set-head origin --auto
          node "$RUNNER_TEMP/craft.cjs" prepare "$VERSION" --no-input
      - name: Open release PR and start checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.prepare.outputs.version }}
          RELEASE_BRANCH: ${{ steps.prepare.outputs.branch }}
        run: |
          set -euo pipefail
          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<EOF
          Prepare version $VERSION with the package version and changelog generated by Craft.

          Review and merge this PR after CI and Binaries pass. Wait for both workflows on the resulting main commit. Run Publish release on main with version $VERSION and that full merged commit SHA to publish the tested executables.
          EOF
          gh pr create --base main --head "$RELEASE_BRANCH" --title "chore(release): $VERSION" --body-file "$BODY_FILE"
          gh workflow run ci.yml --ref "$RELEASE_BRANCH"
          gh workflow run binaries.yml --ref "$RELEASE_BRANCH"
