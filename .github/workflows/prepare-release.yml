name: Prepare release

on:
  workflow_dispatch:
    inputs:
      version:
        description: auto, major, minor, patch, or X.Y.Z[-(alpha|beta|rc)[.track].N] without v
        required: true
        default: auto
        type: string
      target_branch:
        description: Existing branch receiving the release PR. Stable releases require main.
        required: true
        default: main
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: craft-release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v6
        with:
          node-version: 26
      - name: Validate request and pending releases
        id: request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/release-helper"
          cp scripts/release.ts scripts/release-version.ts package.json "$RUNNER_TEMP/release-helper/"
          REQUEST=$(bun "$RUNNER_TEMP/release-helper/release.ts" prepare-request "$VERSION" "$TARGET_BRANCH")
          git ls-remote --exit-code --heads origin "refs/heads/$TARGET_BRANCH"
          if [[ "$(jq -r .kind <<< "$REQUEST")" == explicit ]] && git ls-remote --exit-code --tags origin "refs/tags/v$VERSION"; then
            echo "Tag v$VERSION already exists. Choose an unreleased version."
            exit 1
          fi
          gh pr list --base "$TARGET_BRANCH" --state open --limit 1000 --json headRefName |
            jq -e 'all(.[]; (.headRefName | startswith("release/")) | not)'
          if git ls-remote --exit-code --heads origin "release/$VERSION"; then
            echo "Release branch already exists. Inspect it and open its PR or remove it before preparing again."
            exit 1
          fi
          git fetch origin "refs/heads/$TARGET_BRANCH:refs/remotes/origin/$TARGET_BRANCH"
          SOURCE_SHA=$(git rev-parse "refs/remotes/origin/$TARGET_BRANCH^{commit}")
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          git checkout --detach "$SOURCE_SHA"
      - name: Install Craft
        run: |
          curl -fsSL --retry 3 https://github.com/getsentry/craft/releases/download/2.33.1/craft -o "$RUNNER_TEMP/craft.cjs"
          node "$RUNNER_TEMP/craft.cjs" --version
      - name: Prepare version and changelog
        id: prepare
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          GIT_AUTHOR_NAME: ${{ github.actor }}
          GIT_COMMITTER_NAME: ${{ github.actor }}
          EMAIL: ${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com
          SOURCE_SHA: ${{ steps.request.outputs.source_sha }}
        run: |
          set -euo pipefail
          git remote set-head origin --auto
          node "$RUNNER_TEMP/craft.cjs" prepare "$VERSION" --rev "$SOURCE_SHA" --no-input
      - name: Open release PR and start checks
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.prepare.outputs.version }}
          RELEASE_BRANCH: ${{ steps.prepare.outputs.branch }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          bun "$RUNNER_TEMP/release-helper/release.ts" release-info "$VERSION" "$TARGET_BRANCH"
          [[ "$RELEASE_BRANCH" == "release/$VERSION" ]]
          if [[ "$REQUESTED_VERSION" != auto && "$REQUESTED_VERSION" != major && "$REQUESTED_VERSION" != minor && "$REQUESTED_VERSION" != patch ]]; then
            [[ "$VERSION" == "$REQUESTED_VERSION" ]]
          fi
          [[ "$(git branch --show-current)" == "$RELEASE_BRANCH" ]]
          [[ "$(jq -r .version package.json)" == "$VERSION" ]]
          BODY_FILE=$(mktemp)
          cat > "$BODY_FILE" <<EOF
          Prepare version $VERSION with the package version and changelog generated by Craft.

          Review and merge this PR after CI and Binaries pass. Wait for both workflows on the resulting $TARGET_BRANCH commit. Run Publish release on main with target_branch $TARGET_BRANCH, version $VERSION, and that full merged commit SHA to publish the tested executables.
          EOF
          gh pr create --base "$TARGET_BRANCH" --head "$RELEASE_BRANCH" --title "chore(release): $VERSION" --body-file "$BODY_FILE"
          gh workflow run ci.yml --ref "$RELEASE_BRANCH"
          gh workflow run binaries.yml --ref "$RELEASE_BRANCH"
